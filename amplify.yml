version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - cd notesapp
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - if [ -f ../amplify_outputs.json ]; then cp ../amplify_outputs.json .; fi
        - npm run build
  artifacts:
    baseDirectory: notesapp/dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - notesapp/.npm/**/*
      - node_modules/**/*
      - notesapp/node_modules/**/*
